[project]
name = "optlis"
version = "1.0.0"
description = "Logistique d'Intervention suite aux catastrophes industrielles (LITIS, Université Le Havre Normandie)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thiago J. Barbalho" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "networkx>=3.2",
    "numpy>=2.0",
    "pulp>=2.8,<4",
]

[project.optional-dependencies]
# Helpers used by the notebooks (plots and regressions).
notebooks = [
    "jupyter>=1.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
]

[project.scripts]
optlis = "optlis:main"

[dependency-groups]
dev = [
    "invoke>=2.2",
    "matplotlib>=3.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "scikit-learn>=1.5",
    "types-networkx",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optlis"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebooks", "venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "NPY", # numpy-specific rules
    "RUF", # ruff-specific rules
]
ignore = [
    "E741",   # ambiguous variable names (`l`, `I`) follow the paper's notation
    "N",      # mathematical notation (T, K, S, C...) is intentional
    "RUF001", # French/Unicode text in strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C408"] # `dict(cd_1=..., ...)` reads better for expected solutions

[tool.ruff.lint.isort]
known-first-party = ["optlis"]

# --------------------------------------------------------------------------- #
# Mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["optlis", "tests", "tasks.py"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pulp.*", "sklearn.*", "invoke.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
